name: Build EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name HambaKu --collect-all customtkinter gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: HambaKu-exe
          path: dist/HambaKu.exe
